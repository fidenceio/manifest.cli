# Generated by Manifest CLI from service.spec.yaml `env:` (ENV-001, STANDARD.md §2.7).
# Secret bridge — External Secrets Operator. Store and path come from
# env.secrets in manifest.config.yaml; {env} is filled per environment by
# k8s/env/component. Regenerate: manifest env generate -y
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acme.widget-env
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-store
    kind: ClusterSecretStore
  target:
    name: acme.widget-env
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: "secret/data/{env}/acme.widget/database"
        property: "ACME_WIDGET_DATABASE_URL"
    - secretKey: ACME_WIDGET_SIGNING_KEY
      remoteRef:
        key: "secret/data/{env}/acme.widget/app"
        property: "ACME_WIDGET_SIGNING_KEY"
