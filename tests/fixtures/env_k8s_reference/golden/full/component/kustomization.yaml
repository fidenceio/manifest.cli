# Generated by Manifest CLI from service.spec.yaml `env:`.
# Fills {env} in every remoteRef.key of the ExternalSecret from the `environment`
# label, per environment. kustomize runs a Component before the including
# kustomization's own transformers, so the label must already be on the
# ExternalSecret when this is included: label it one layer down, in a
# kustomization that references the k8s/env DIRECTORY (its kustomization.yaml
# is generated beside this file; a file outside the referencing directory is
# refused by kustomize).
#   k8s/overlays/<environment>/env/kustomization.yaml
#     resources: [ ../../../env ]
#     labels: [ { pairs: { environment: <environment> } } ]
#   k8s/overlays/<environment>/kustomization.yaml
#     resources: [ env ]
#     components: [ ../../env/component ]
# Regenerate: manifest env generate -y
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
replacements:
  - source:
      kind: ExternalSecret
      name: acme.widget-env
      fieldPath: metadata.labels.environment
    targets:
      - select:
          kind: ExternalSecret
          name: acme.widget-env
        fieldPaths:
          - spec.data.*.remoteRef.key
        options:
          delimiter: "/"
          index: 2
